<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Генератор випадкових чисел</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b10;
      --surface: rgba(255, 255, 255, 0.035);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #eef0f6;
      --muted: #8a8fa3;
      --accent: #7c8cff;
      --accent-2: #b48cff;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }
    body::before { background: var(--accent); top: -180px; left: -160px; }
    body::after  { background: var(--accent-2); bottom: -200px; right: -180px; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 40px 36px 28px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }
    .badge::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    h1 {
      margin: 18px 0 28px;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(22px, 5vw, 26px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .range {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 12px;
      margin-bottom: 24px;
    }

    .field { text-align: left; }

    .field label {
      display: block;
      margin: 0 0 8px 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .range input {
      width: 100%;
      padding: 14px 16px;
      font: 500 18px 'Inter', sans-serif;
      color: var(--text);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      -moz-appearance: textfield;
    }
    .range input::-webkit-outer-spin-button,
    .range input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .range input:hover { border-color: var(--border-strong); }
    .range input:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 0 4px rgba(124, 140, 255, 0.18);
    }

    .dash {
      padding-bottom: 16px;
      color: var(--muted);
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 170px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(124,140,255,0.12), transparent 60%),
        rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    #result {
      max-width: 100%;
      padding: 0 12px;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(56px, 16vw, 88px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      background: linear-gradient(180deg, #ffffff 20%, #aab3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 30px rgba(124, 140, 255, 0.35));
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.4s ease-out, transform 0.4s cubic-bezier(.2,.9,.3,1.2);
    }

    button {
      width: 100%;
      padding: 16px 24px;
      font: 600 16px 'Inter', sans-serif;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px -8px rgba(124, 140, 255, 0.6), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    }
    button:hover {
      filter: brightness(1.08);
      box-shadow: 0 14px 36px -8px rgba(124, 140, 255, 0.75), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #5c6074;
    }

    #hiddenInput {
      position: absolute;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    #hiddenInput.active {
      left: 10px;
      top: 10px;
      opacity: 1;
      pointer-events: auto;
      position: fixed;
      z-index: 9999;
      width: 160px;
      padding: 10px 12px;
      font: 14px 'Inter', sans-serif;
      color: var(--text);
      background: #14151c;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      outline: none;
    }

    @media (max-width: 420px) {
      .card { padding: 32px 20px 22px; border-radius: 24px; }
      .range { gap: 8px; }
      .range input { padding: 12px; font-size: 16px; }
      .stage { min-height: 140px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      #result { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Random Picker</span>
    <h1>Генератор випадкового числа</h1>

    <div class="range">
      <div class="field">
        <label for="min">Від</label>
        <input type="number" id="min" value="1" />
      </div>
      <span class="dash">—</span>
      <div class="field">
        <label for="max">До</label>
        <input type="number" id="max" value="1000" />
      </div>
    </div>

    <div class="stage">
      <div id="result">—</div>
    </div>
    <button onclick="generate()">Згенерувати</button>
    <footer>Random Picker © 2026</footer>
  </div>

  <input type="number" id="hiddenInput" placeholder="Таємне число" />

  <script>
    let riggedNumber = 1121;

    const hiddenInput = document.getElementById('hiddenInput');

    function generate() {
      const resultElement = document.getElementById('result');
      const min = parseInt(document.getElementById('min').value);
      const max = parseInt(document.getElementById('max').value);

      let result;

      if (riggedNumber !== null && !isNaN(riggedNumber)) {
        result = riggedNumber;
      } else {
        result = Math.floor(Math.random() * (max - min + 1)) + min;
      }

      resultElement.style.opacity = 0;
      resultElement.style.transform = 'scale(0)';

      setTimeout(() => {
        resultElement.textContent = result;
        resultElement.style.opacity = 1;
        resultElement.style.transform = 'scale(1)';
      }, 400);
    }

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === '0') {
        hiddenInput.classList.toggle('active');
        hiddenInput.focus();
      }
    });

    hiddenInput.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      riggedNumber = isNaN(val) ? null : val;
    });
  </script>
</body>
</html>
